name: Build Quickly Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'Quickly/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Quickly Android APK & Auto-Deploy Live OTA
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Gradlew Executable
        run: chmod +x Quickly/android/gradlew

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android Platforms 35 and 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Quickly/package-lock.json

      - name: Install Node Dependencies
        working-directory: Quickly
        run: npm ci

      - name: Build Web Production Assets
        working-directory: Quickly
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: Quickly
        run: npx cap sync android

      - name: Create Live OTA Bundle ZIP and Compute SHA256 Checksum
        working-directory: Quickly
        run: |
          cd dist
          zip -r ../Quickly-OTA-Bundle.zip .
          cd ..
          CHECKSUM=$(sha256sum Quickly-OTA-Bundle.zip | awk '{print $1}')
          echo "OTA_CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "$CHECKSUM" > Quickly-OTA-Bundle.zip.sha256
          echo "Generated SHA-256 Checksum: $CHECKSUM"

      - name: Upload Live OTA Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quickly-OTA-Bundle
          path: |
            Quickly/Quickly-OTA-Bundle.zip
            Quickly/Quickly-OTA-Bundle.zip.sha256
          if-no-files-found: error

      - name: Build Debug APK with Gradle
        working-directory: Quickly/android
        run: |
          ./gradlew assembleDebug -PappVersionCode=${{ github.run_number }} -PappVersionName="1.0.${{ github.run_number }}" --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Quickly-Debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Quickly-Debug-APK
          path: Quickly/Quickly-Debug.apk
          if-no-files-found: error

      - name: Publish Live OTA Release Asset & Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: live-ota
          name: "Quickly Live OTA Release (Auto-Deploy)"
          files: |
            Quickly/Quickly-OTA-Bundle.zip
            Quickly/Quickly-OTA-Bundle.zip.sha256
            Quickly/Quickly-Debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Sync OTA Version to Supabase
        if: github.ref == 'refs/heads/main'
        working-directory: Quickly
        env:
          OTA_CHECKSUM: ${{ env.OTA_CHECKSUM }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const client = createClient('https://bbaggauqnlcohrgvsios.supabase.co', 'sb_publishable_rCjAUoKGrW0u-CCnBb9rQw_ori9Y1dQ');
            async function update() {
              const version = '1.0.${{ github.run_number }}';
              const downloadUrl = 'https://github.com/utkarshchaurasia2010/Zipit-Latest/releases/download/live-ota/Quickly-OTA-Bundle.zip';
              const checksum = process.env.OTA_CHECKSUM || '';
              const { data: profile } = await client.from('profiles').select('address').eq('id', '00000000-0000-0000-0000-000000000001').single();
              const parsed = profile?.address ? JSON.parse(profile.address) : {};
              parsed.ota_bundle_version = version;
              parsed.ota_bundle_url = downloadUrl;
              parsed.ota_bundle_checksum = checksum;
              parsed.ota_last_published_at = new Date().toISOString();
              const { error } = await client.from('profiles').update({ address: JSON.stringify(parsed) }).eq('id', '00000000-0000-0000-0000-000000000001');
              if (error) {
                console.error('Failed to update Supabase:', error);
                process.exit(1);
              }
              console.log('Successfully pushed OTA version ' + version + ' with checksum ' + checksum + ' to Supabase!');
            }
            update();
          "
