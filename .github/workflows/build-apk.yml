name: Build Quickly Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'Quickly/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Quickly Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Gradlew Executable
        run: chmod +x Quickly/android/gradlew

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Quickly/package-lock.json

      - name: Install Node Dependencies
        working-directory: Quickly
        run: npm ci

      - name: Build Web Production Assets
        working-directory: Quickly
        run: npm run build

      - name: Copy Web Assets into Android App
        working-directory: Quickly
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: Build Debug APK with Gradle
        working-directory: Quickly/android
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Check Build Output
        working-directory: Quickly/android
        shell: bash
        run: |
          echo "=== APK Search ==="
          find . -name "*.apk" -ls

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Quickly-Debug-APK
          path: 'Quickly/android/**/*.apk'
          if-no-files-found: error

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: Quickly/android/build.log
