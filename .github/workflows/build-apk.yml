name: Build Quickly Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'Quickly/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Quickly Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Quickly/package-lock.json

      - name: Install Node Dependencies
        working-directory: Quickly
        run: npm ci

      - name: Build Web Production Assets
        working-directory: Quickly
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        working-directory: Quickly
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: Quickly/android
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: Quickly/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Quickly-Debug-APK
          path: Quickly/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
